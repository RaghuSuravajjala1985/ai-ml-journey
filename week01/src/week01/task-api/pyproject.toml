[project]
name = "task-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "RaghuSuravajjala1985", email = "suravajjala.raghavendra@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.2",
]

[project.scripts]
task-api = "task_api:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]